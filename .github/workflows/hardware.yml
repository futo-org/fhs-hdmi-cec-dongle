name: hardware

on:
  push:
    paths: ["hardware/pcb/**", "firmware/**", ".github/workflows/hardware.yml"]
  pull_request:
    paths: ["hardware/pcb/**", "firmware/**", ".github/workflows/hardware.yml"]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build everything a hardware release ships from, such as a release tag
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      drc:
        description: Run DRC
        type: boolean
        default: true
      production:
        description: Build PCB production files
        type: boolean
        default: true
      programming:
        description: Build programming package
        type: boolean
        default: true

env:
  BOARD: hdmi-cec.kicad_pcb
  SCHEMATIC: hdmi-cec.kicad_sch
  PANEL: production/panel/hdmi-cec-panel.kicad_pcb
  OUT: production/hdmi-cec
  PANEL_OUT: production/hdmi-cec-panel
  STEP: production/hdmi-cec.step
  GERBER_LAYERS: F.Cu,In1.Cu,In2.Cu,B.Cu,F.Paste,B.Paste,F.Silkscreen,B.Silkscreen,F.Mask,B.Mask,Edge.Cuts

jobs:
  drc:
    if: inputs.ref != '' || github.event_name != 'workflow_dispatch' || inputs.drc
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0-full
      options: --user root
    defaults:
      run:
        working-directory: hardware/pcb
    env:
      KICAD_CONFIG_HOME: /tmp/kicad
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install stock footprint libs
        run: |
          mkdir -p "$KICAD_CONFIG_HOME/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$KICAD_CONFIG_HOME/10.0/"
      - name: DRC
        run: kicad-cli pcb drc --severity-error --severity-warning --exit-code-violations -o "$RUNNER_TEMP/drc.rpt" "$BOARD"
      - name: Report
        if: failure()
        run: cat "$RUNNER_TEMP/drc.rpt"

  production:
    if: inputs.ref != '' || github.event_name != 'workflow_dispatch' || inputs.production
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0-full
      options: --user root
    defaults:
      run:
        working-directory: hardware/pcb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install curl for mise
        run: apt-get update -qq && apt-get install -y -qq curl
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Panel
        run: mise trust && mise install && mise run panel
      - name: Gerbers
        run: |
          gerbers() {
            name=$(basename "$1" .kicad_pcb)
            kicad-cli pcb export gerbers --check-zones --layers "$GERBER_LAYERS" -o "$2/gerbers/" "$1"
            kicad-cli pcb export drill --excellon-separate-th -o "$2/gerbers/" "$1"
            (cd "$2/gerbers" && python3 -m zipfile -c "../$name-gerbers.zip" *)
            rm -r "$2/gerbers"
          }
          gerbers "$BOARD" "$OUT"
          gerbers "$PANEL" "$PANEL_OUT"
      - name: STEP
        run: kicad-cli pcb export step --subst-models -o "$STEP" "$BOARD"
      - name: BOM and CPL
        run: |
          kicad-cli sch export bom --exclude-dnp --group-by '' --field-delimiter '|' --string-delimiter '' \
            --fields 'Reference,Value,${FOOTPRINT_NAME},LCSC' -o "$RUNNER_TEMP/parts.txt" "$SCHEMATIC"
          assembly() {
            name=$(basename "$1" .kicad_pcb)
            mkdir -p "$2/assembly"
            kicad-cli pcb export pos --exclude-dnp --format csv --units mm --side both -o "$RUNNER_TEMP/$name-pos.csv" "$1"
            awk -F, -v bom="$2/assembly/$name-bom.csv" -f jlc-assembly.awk \
              "$RUNNER_TEMP/parts.txt" "$RUNNER_TEMP/$name-pos.csv" > "$2/assembly/$name-cpl.csv"
          }
          assembly "$BOARD" "$OUT"
          assembly "$PANEL" "$PANEL_OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-cec-production
          path: hardware/pcb/${{ env.OUT }}/
      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-cec-panel-production
          path: hardware/pcb/${{ env.PANEL_OUT }}/
      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-cec-step
          path: hardware/pcb/${{ env.STEP }}

  changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      programming: ${{ steps.filter.outputs.programming }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            programming:
              - firmware/**
              - hardware/pcb/production/PROGRAMMING.typ
              - .github/workflows/hardware.yml

  programming:
    needs: changes
    if: >-
      ${{ !cancelled() && (
        inputs.ref != '' ||
        (github.event_name == 'workflow_dispatch' && inputs.programming) ||
        needs.changes.outputs.programming == 'true'
      ) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    env:
      PRESET: Release
      ELF: build/Release/fhs-hdmi-controller.elf
      FIRMWARE: fhs-cec-firmware
      PKG: ${{ github.workspace }}/programming
      DOCS: ${{ github.workspace }}/hardware/pcb/production
      TYPST: 0.15.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@v2
        with:
          working_directory: firmware
          install_args: cmake ninja gcc-arm-none-eabi
      - name: Build firmware
        run: mise run build
      - name: Package
        run: |
          mkdir -p "$PKG"
          mise x "typst@$TYPST" -- typst compile --ignore-system-fonts "$DOCS/PROGRAMMING.typ" "$PKG/PROGRAMMING.pdf"
          arm-none-eabi-objcopy -O ihex "$ELF" "$PKG/$FIRMWARE.hex"
          arm-none-eabi-objcopy -O binary "$ELF" "$PKG/$FIRMWARE.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: fhs-cec-programming
          path: ${{ env.PKG }}/
