name: hardware

on:
  push:
    paths: ["hardware/pcb/**", ".github/workflows/hardware.yml"]
  pull_request:
    paths: ["hardware/pcb/**", ".github/workflows/hardware.yml"]

env:
  BOARD: hdmi-cec.kicad_pcb
  SCHEMATIC: hdmi-cec.kicad_sch
  PANEL: production/panel/hdmi-cec-panel.kicad_pcb
  OUT: production/hdmi-cec
  PANEL_OUT: production/hdmi-cec-panel
  STEP: production/hdmi-cec.step
  GERBER_LAYERS: F.Cu,In1.Cu,In2.Cu,B.Cu,F.Paste,B.Paste,F.Silkscreen,B.Silkscreen,F.Mask,B.Mask,Edge.Cuts

jobs:
  drc:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0-full
      options: --user root
    defaults:
      run:
        working-directory: hardware/pcb
    env:
      KICAD_CONFIG_HOME: /tmp/kicad
    steps:
      - uses: actions/checkout@v4
      - name: Install stock footprint libs
        run: |
          mkdir -p "$KICAD_CONFIG_HOME/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$KICAD_CONFIG_HOME/10.0/"
      - name: DRC
        run: kicad-cli pcb drc --severity-error --severity-warning --exit-code-violations -o "$RUNNER_TEMP/drc.rpt" "$BOARD"
      - name: Report
        if: failure()
        run: cat "$RUNNER_TEMP/drc.rpt"

  production:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0-full
      options: --user root
    defaults:
      run:
        working-directory: hardware/pcb
    steps:
      - uses: actions/checkout@v4
      - name: Install curl for mise
        run: apt-get update -qq && apt-get install -y -qq curl
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Panel
        run: mise trust && mise install && mise run panel
      - name: Gerbers
        run: |
          gerbers() {
            name=$(basename "$1" .kicad_pcb)
            kicad-cli pcb export gerbers --check-zones --layers "$GERBER_LAYERS" -o "$2/gerbers/" "$1"
            kicad-cli pcb export drill --excellon-separate-th -o "$2/gerbers/" "$1"
            (cd "$2/gerbers" && python3 -m zipfile -c "../$name-gerbers.zip" *)
            rm -r "$2/gerbers"
          }
          gerbers "$BOARD" "$OUT"
          gerbers "$PANEL" "$PANEL_OUT"
      - name: STEP
        run: kicad-cli pcb export step --subst-models -o "$STEP" "$BOARD"
      - name: BOM and CPL
        run: |
          kicad-cli sch export bom --exclude-dnp --group-by '' --field-delimiter '|' --string-delimiter '' \
            --fields 'Reference,Value,${FOOTPRINT_NAME},LCSC' -o "$RUNNER_TEMP/parts.txt" "$SCHEMATIC"
          assembly() {
            name=$(basename "$1" .kicad_pcb)
            mkdir -p "$2/assembly"
            kicad-cli pcb export pos --exclude-dnp --format csv --units mm --side both -o "$RUNNER_TEMP/$name-pos.csv" "$1"
            awk -F, -v bom="$2/assembly/$name-bom.csv" -f jlc-assembly.awk \
              "$RUNNER_TEMP/parts.txt" "$RUNNER_TEMP/$name-pos.csv" > "$2/assembly/$name-cpl.csv"
          }
          assembly "$BOARD" "$OUT"
          assembly "$PANEL" "$PANEL_OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-cec-production
          path: hardware/pcb/${{ env.OUT }}/
      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-cec-panel-production
          path: hardware/pcb/${{ env.PANEL_OUT }}/
      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-cec-step
          path: hardware/pcb/${{ env.STEP }}
