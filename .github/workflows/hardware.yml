name: hardware

on:
  push:
    paths: ["hardware/pcb/**", ".github/workflows/hardware.yml"]
  pull_request:
    paths: ["hardware/pcb/**", ".github/workflows/hardware.yml"]

env:
  BOARD: hdmi-cec.kicad_pcb
  SCHEMATIC: hdmi-cec.kicad_sch
  OUT: production
  PANELS: production/panel/hdmi-cec-panel.kicad_pcb production/panel/hdmi-cec-panel-mousebites.kicad_pcb
  GERBER_LAYERS: F.Cu,In1.Cu,In2.Cu,B.Cu,F.Paste,B.Paste,F.Silkscreen,B.Silkscreen,F.Mask,B.Mask,Edge.Cuts

jobs:
  drc:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0-full
      options: --user root
    defaults:
      run:
        working-directory: hardware/pcb
    env:
      KICAD_CONFIG_HOME: /tmp/kicad
    steps:
      - uses: actions/checkout@v4
      - name: Install stock footprint libs
        run: |
          mkdir -p "$KICAD_CONFIG_HOME/10.0"
          cp /usr/share/kicad/template/fp-lib-table "$KICAD_CONFIG_HOME/10.0/"
      - name: DRC
        run: kicad-cli pcb drc --severity-error --severity-warning --exit-code-violations -o "$RUNNER_TEMP/drc.rpt" "$BOARD"
      - name: Report
        if: failure()
        run: cat "$RUNNER_TEMP/drc.rpt"

  production:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0-full
      options: --user root
    defaults:
      run:
        working-directory: hardware/pcb
    steps:
      - uses: actions/checkout@v4
      - name: Gerbers
        run: kicad-cli pcb export gerbers --check-zones --layers "$GERBER_LAYERS" -o "$OUT/gerbers/" "$BOARD"
      - name: Drill
        run: kicad-cli pcb export drill --excellon-separate-th -o "$OUT/gerbers/" "$BOARD"
      - name: Install curl for mise
        run: apt-get update -qq && apt-get install -y -qq curl
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: Panel
        run: mise trust && mise install && mise run panel && mise run panel-mousebites
      - name: Panel gerbers
        run: |
          for board in $PANELS; do
            name=$(basename "$board" .kicad_pcb)
            kicad-cli pcb export gerbers --check-zones --layers "$GERBER_LAYERS" -o "$OUT/panel/$name/" "$board"
            kicad-cli pcb export drill --excellon-separate-th -o "$OUT/panel/$name/" "$board"
          done
      - name: STEP
        run: kicad-cli pcb export step --subst-models -o "$STEP" "$BOARD"
      - name: BOM
        run: |
          mkdir -p "$OUT/assembly"
          kicad-cli sch export bom --exclude-dnp --ref-range-delimiter '' \
            --fields 'Value,Reference,${FOOTPRINT_NAME},LCSC' \
            --labels 'Comment,Designator,Footprint,LCSC Part #' \
            --group-by 'Value,${FOOTPRINT_NAME},LCSC' \
            -o "$OUT/assembly/hdmi-cec-bom.csv" "$SCHEMATIC"
      # Placements are limited to BOM refs so test points, jumpers and the logo stay out of the CPL
      - name: CPL
        run: |
          kicad-cli sch export bom --exclude-dnp --fields Reference --group-by '' -o "$RUNNER_TEMP/refs.csv" "$SCHEMATIC"
          for board in "$BOARD" $PANELS; do
            name=$(basename "$board" .kicad_pcb)
            kicad-cli pcb export pos --exclude-dnp --format csv --units mm --side both -o "$RUNNER_TEMP/$name-pos.csv" "$board"
            awk -F, 'NR == FNR { gsub(/"/, ""); refs[$1]; next }
              FNR == 1 { print "Designator,Mid X,Mid Y,Layer,Rotation"; next }
              { gsub(/"/, "") }
              $1 in refs { printf "%s,%.4fmm,%.4fmm,%s,%d\n", $1, $4, $5, ($7 == "top" ? "Top" : "Bottom"), $6 }' \
              "$RUNNER_TEMP/refs.csv" "$RUNNER_TEMP/$name-pos.csv" > "$OUT/assembly/$name-cpl.csv"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-cec-production
          path: hardware/pcb/${{ env.OUT }}/
      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-cec-panel-gerbers
          path: hardware/pcb/production/panel/hdmi-cec-panel/
      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-cec-panel-mousebites-gerbers
          path: hardware/pcb/production/panel/hdmi-cec-panel-mousebites/
      - uses: actions/upload-artifact@v4
        with:
          name: hdmi-cec-step
          path: hardware/pcb/${{ env.STEP }}
