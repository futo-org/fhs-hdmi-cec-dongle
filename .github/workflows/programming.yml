name: programming

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  PRESET: Release
  ELF: build/Release/fhs-hdmi-controller.elf
  FIRMWARE: fhs-cec-firmware
  PKG: ${{ github.workspace }}/programming

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: firmware
          install_args: cmake ninja gcc-arm-none-eabi
      - name: Build firmware
        run: mise run build
      - name: Package
        run: |
          mkdir -p "$PKG"
          cp -r ../hardware/pcb/production/PROGRAMMING.md ../hardware/pcb/production/images "$PKG/"
          arm-none-eabi-objcopy -O ihex "$ELF" "$PKG/$FIRMWARE.hex"
          arm-none-eabi-objcopy -O binary "$ELF" "$PKG/$FIRMWARE.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: fhs-cec-programming-${{ github.event.release.tag_name || github.sha }}
          path: ${{ env.PKG }}/
