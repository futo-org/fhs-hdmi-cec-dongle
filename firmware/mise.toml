# FHS CEC dongle, STM32F072CBU6. Toolchain is mise-managed: no STM32Cube VS Code bundles.

[tools]
cmake = "4.4.3"
ninja = "1.13.2"
gcc-arm-none-eabi = "13.3.Rel1"
"ubi:probe-rs/probe-rs" = { version = "latest", exe = "probe-rs" }
uv = "0.12.13"                 # runs the pyserial scripts below

[env]
PRESET = "{{ env.PRESET | default(value='Debug') }}"
CHIP = "STM32F072CB"
BAUD = "{{ env.BAUD | default(value='115200') }}"
PYSERIAL = "uv run --quiet --with pyserial==3.5"
# USB CDC debug console (Debug preset), found by USB VID:PID instead of a fixed
# device node, so the same task works on Linux (/dev/ttyACM*), macOS
# (/dev/cu.usbmodem*) and Windows (COM*). VID:PID from driver/fhs-cec-proto.h.
SERIAL_PORT = "{{ env.SERIAL_PORT | default(value='hwgrep://1209:0001') }}"
ELF = "build/{{ env.PRESET | default(value='Debug') }}/fhs-hdmi-controller.elf"

[tasks.configure]
description = "CMake configure (PRESET, default Debug)"
run = "cmake --preset $PRESET"

[tasks.build]
description = "Build firmware"
depends = ["configure"]
run = "cmake --build --preset $PRESET"

[tasks.load]
description = "Build, flash and reset the board"
depends = ["build"]
run = ["probe-rs download --chip $CHIP $ELF", "probe-rs reset --chip $CHIP"]

[tasks.connect]
description = "List probes + read DBGMCU_IDCODE, read-only"
run = ["probe-rs list", "probe-rs read --chip $CHIP b32 0x40015800 1"]

[tasks.verify]
description = "Check flash contents match the built ELF"
depends = ["build"]
run = "probe-rs verify --chip $CHIP $ELF"

[tasks.erase]
description = "Mass-erase the flash"
run = "probe-rs erase --chip $CHIP"

[tasks.reset]
description = "Reset the target"
run = "probe-rs reset --chip $CHIP"

[tasks.size]
description = "Section sizes of the built ELF"
depends = ["build"]
run = "arm-none-eabi-size -Ax $ELF"

[tasks.clean]
description = "Delete the build tree"
run = "rm -rf build"

[tasks.gdbserver]
description = "probe-rs GDB server on :1337"
run = "probe-rs gdb --chip $CHIP"

[tasks.gdb]
description = "Attach gdb to a running gdbserver (needs ncurses-compat-libs)"
depends = ["build"]
run = "arm-none-eabi-gdb $ELF -ex 'target extended-remote :1337'"

[tasks.monitor]
description = "Open the USB debug console, survives replug (Ctrl-] to quit)"
run = "$PYSERIAL tools/monitor.py $SERIAL_PORT $BAUD"

[tasks.ports]
description = "List serial ports with their USB VID:PID"
run = "$PYSERIAL -m serial.tools.list_ports -v"
